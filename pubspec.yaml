name: pos_mobile
description: Klien mobile POS (Flutter) untuk backend POS di E:/code/pos.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  go_router: ^14.0.0
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
